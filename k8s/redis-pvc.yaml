apiVersion: v1
kind: PersistentVolume
metadata:
  name: dfec-redis-volume
  labels: 
    type: local
spec:
  storageClassName: manual 
  capacity: 
    storage: 100Mi
  accessModes: 
    - ReadWriteMany
  hostPath:
    path: "/mnt/data"
  persistentVolumeReclaimPolicy: Delete

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dfec-redis-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
