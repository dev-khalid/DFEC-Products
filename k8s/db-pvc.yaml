apiVersion: v1
kind: PersistentVolume
metadata:
  name: dfec-products-db-volume
  labels: 
    type: local
spec:
  storageClassName: manual 
  capacity: 
    storage: 1Gi
  accessModes: 
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"
  persistentVolumeReclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dfec-products-db-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi