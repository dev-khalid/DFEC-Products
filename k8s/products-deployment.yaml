apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfec-products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dfec-products
  template:
    metadata:
      labels:
        app: dfec-products
    spec:
      containers:
        - name: dfec-products-container
          image: khalidhossain/dfec-products:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-env
            - configMapRef:
                name: dfec-products-env
            - secretRef:
                name: dfec-secrets

          command: ['npm', 'run', 'start:prod']

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: '500Mi'
              cpu: '250m'
            limits:
              memory: '1024Mi'
              cpu: '500m'
---
apiVersion: v1
kind: Service
metadata:
  name: dfec-products-svc
spec:
  selector:
    app: dfec-products
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31110
  type: LoadBalancer
